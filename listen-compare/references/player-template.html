<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f4f6f3;
    --card: #ffffff;
    --text: #20261f;
    --muted: #67705f;
    --accent: #1f6f54;
    --accent-soft: #ddeee2;
    --border: #dde3d8;
    --playing-bg: #ecf5ec;
    --on-accent: #ffffff;
    --warn-bg: #f7ecdc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171b17; --card: #21281f; --text: #e7ece2; --muted: #9aa78f;
      --accent: #6cc397; --accent-soft: #24402f; --border: #333d2e;
      --playing-bg: #223528; --on-accent: #10201a; --warn-bg: #3d3322;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171b17; --card: #21281f; --text: #e7ece2; --muted: #9aa78f;
    --accent: #6cc397; --accent-soft: #24402f; --border: #333d2e;
    --playing-bg: #223528; --on-accent: #10201a; --warn-bg: #3d3322;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; line-height: 1.7; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.25rem; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  button { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button:active { transform: scale(0.97); }
  select { font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 8px; padding: 6px 8px; }
  .status { font-size: 0.8rem; color: var(--muted); width: 100%; }
  .sec { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin: 12px 0; }
  .sec.playing { background: var(--playing-bg); border-color: var(--accent); }
  .sec-head { display: flex; align-items: center; gap: 10px; }
  .sec-head .play { flex: 0 0 auto; width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 0.9rem; }
  .sec.playing .play { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .sec-label { font-weight: 600; }
  .sec-est { color: var(--muted); font-size: 0.78rem; margin-left: auto; flex: 0 0 auto; }
  .sec-text { color: var(--text); font-size: 0.95rem; margin-top: 8px; white-space: pre-wrap; }
  .warn { background: var(--warn-bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.85rem; display: none; margin-top: 10px; }
</style>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <button class="primary" id="playAll">▶ 从头连播</button>
    <button id="stop">⏹ 停</button>
    <select id="rate" aria-label="语速">
      <option value="0.9">慢速</option>
      <option value="1" selected>正常语速</option>
      <option value="1.2">1.2 倍速</option>
      <option value="1.5">1.5 倍速</option>
    </select>
    <div class="status" id="status">准备好了</div>
  </div>
  <div class="warn" id="warn"></div>
  <div id="list"></div>
</div>
<script>
  const TITLE = "__TITLE__";
  // Each section: {label, text, audio?} — audio is an optional data: URI (m4a).
  // With audio the player just plays the recording (identical on every device);
  // without it, it falls back to the device's own Chinese TTS voice.
  const SECTIONS = __SECTIONS_JSON__;

  const HAS_AUDIO = SECTIONS.every(s => s.audio);
  document.getElementById('title').textContent = TITLE;
  document.getElementById('sub').textContent = HAS_AUDIO
    ? '点 ▶ 听单段,或从头连播。内嵌录音,任何手机效果一致,不联网。'
    : '点 ▶ 听单段,或从头连播。用这台手机自带的中文语音,不联网。';
  const list = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const rateEl = document.getElementById('rate');
  const warnEl = document.getElementById('warn');
  function warn(msg) { warnEl.textContent = msg; warnEl.style.display = 'block'; }

  function estimate(text) {
    const sec = Math.round(text.length / 4.5);
    return sec < 60 ? '约 ' + sec + ' 秒' : '约 ' + Math.round(sec / 60) + ' 分钟';
  }

  SECTIONS.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'sec';
    div.id = 'sec-' + i;
    div.innerHTML =
      '<div class="sec-head">' +
      '<button class="play" data-i="' + i + '" aria-label="播放本段">▶</button>' +
      '<span class="sec-label"></span><span class="sec-est" id="est-' + i + '">' + estimate(s.text) + '</span></div>' +
      '<div class="sec-text"></div>';
    div.querySelector('.sec-label').textContent = s.label;
    div.querySelector('.sec-text').textContent = s.text;
    list.appendChild(div);
  });

  let session = 0; // bump to invalidate stale callbacks after a stop
  function setPlaying(i) {
    document.querySelectorAll('.sec').forEach(el => el.classList.remove('playing'));
    if (i >= 0) {
      document.getElementById('sec-' + i).classList.add('playing');
      statusEl.textContent = '正在播:' + SECTIONS[i].label;
    }
  }
  function donePlaying() { setPlaying(-1); statusEl.textContent = '播完了'; }

  // ---------- Route A: embedded recordings ----------
  const players = [];
  if (HAS_AUDIO) {
    SECTIONS.forEach((s, i) => {
      const a = new Audio(s.audio);
      a.preload = 'metadata';
      a.addEventListener('loadedmetadata', () => {
        if (isFinite(a.duration)) {
          const sec = Math.round(a.duration);
          document.getElementById('est-' + i).textContent =
            sec < 60 ? sec + ' 秒' : Math.round(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
        }
      });
      players.push(a);
    });
  }
  function stopAudio() { players.forEach(a => { a.pause(); a.currentTime = 0; }); }
  function playAudioFrom(i, thenNext) {
    const mySession = session;
    const a = players[i];
    a.playbackRate = parseFloat(rateEl.value);
    setPlaying(i);
    a.onended = () => {
      if (mySession !== session) return;
      if (thenNext && i + 1 < SECTIONS.length) playAudioFrom(i + 1, true);
      else donePlaying();
    };
    a.play().catch(() => warn('播放没启动。再点一次 ▶ 试试;还不行的话,文字都在下面,可以直接看。'));
  }

  // ---------- Route B: device TTS fallback ----------
  const ttsSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

  function chunks(text) { // iOS cuts off long utterances — speak sentence-sized pieces
    const parts = text.match(/[^。！？!?；;\n]+[。！？!?；;]?/g) || [text];
    const out = [];
    for (const p of parts) {
      const t = p.trim();
      if (!t) continue;
      if (out.length && (out[out.length - 1] + t).length < 60) out[out.length - 1] += t;
      else out.push(t);
    }
    return out;
  }

  // iOS loads the voice list asynchronously and sometimes only after a first
  // speak() — wake it up and wait rather than trusting the first empty answer.
  function ensureVoices() {
    return new Promise(resolve => {
      let vs = speechSynthesis.getVoices();
      if (vs.length) return resolve(vs);
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
      let waited = 0;
      const t = setInterval(() => {
        vs = speechSynthesis.getVoices();
        waited += 150;
        if (vs.length || waited >= 2000) { clearInterval(t); resolve(vs); }
      }, 150);
    });
  }

  function pickZhVoice(vs) {
    const novelty = /Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Albert|Bahh|Bells|Boing|Bubbles|Cellos|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Good News|Bad News/i;
    const cn = v => /^zh[-_]?(CN|Hans)/i.test(v.lang);
    const tw = v => /^zh[-_]?(TW|Hant)/i.test(v.lang); // Mandarin too
    return vs.find(v => cn(v) && /Ting|婷|Siri|Yu-shu|Lili|Huihui|Yaoyao|Xiaoxiao/i.test(v.name))
      || vs.find(v => cn(v) && !novelty.test(v.name))
      || vs.find(v => tw(v) && !novelty.test(v.name))
      || vs.find(cn) || vs.find(tw) || null;
    // deliberately never "any zh": zh-HK is Cantonese, and a non-zh voice
    // reading Chinese produces punctuation-only gibberish ("semicolon…")
  }

  async function playTtsFrom(i, thenNext) {
    const vs = await ensureVoices();
    const voice = pickZhVoice(vs);
    if (!voice) {
      warn('这台设备上找不到中文语音,朗读会变成乱念,已停止。解决办法:iPhone 上到 设置 → 辅助功能 → 朗读内容 → 声音 → 中文,下载一个声音(比如"婷婷");或者回到对话里让 Claude 改发"录音版"。文字都在下面,现在就可以直接看。');
      statusEl.textContent = '没有中文语音,未播放';
      return;
    }
    const mySession = session;
    setPlaying(i);
    const parts = chunks(SECTIONS[i].text);
    const startAt = Date.now();
    let idx = 0;
    function next() {
      if (mySession !== session) return;
      if (idx >= parts.length) {
        // A voice that skips CJK burns the queue near-instantly — call that out
        // instead of pretending it played.
        if (Date.now() - startAt < SECTIONS[i].text.length * 12) {
          warn('刚才的朗读不正常(几乎瞬间结束),这台设备的中文语音可能坏了或没装全。文字都在下面可以直接看,或回对话里让 Claude 改发"录音版"。');
          setPlaying(-1); statusEl.textContent = '朗读异常';
          return;
        }
        if (thenNext && i + 1 < SECTIONS.length) playTtsFrom(i + 1, true);
        else donePlaying();
        return;
      }
      const u = new SpeechSynthesisUtterance(parts[idx++]);
      u.voice = voice;
      u.lang = voice.lang;
      u.rate = parseFloat(rateEl.value);
      u.onend = next;
      u.onerror = next;
      speechSynthesis.speak(u);
    }
    next();
  }

  // ---------- shared controls ----------
  function playFrom(i, thenNext) {
    if (HAS_AUDIO) playAudioFrom(i, thenNext);
    else if (ttsSupported) playTtsFrom(i, thenNext);
    else warn('这个浏览器不能出声。文字都在下面,可以直接看;iPhone 也可以用「朗读屏幕」(设置 → 辅助功能 → 朗读内容),两指从屏幕顶端下滑朗读本页。');
  }
  function stopAll() {
    session++;
    if (HAS_AUDIO) stopAudio();
    if (ttsSupported) { try { speechSynthesis.cancel(); } catch (e) {} }
    setPlaying(-1);
    statusEl.textContent = '已停止';
  }
  document.getElementById('playAll').addEventListener('click', () => { stopAll(); session++; playFrom(0, true); });
  document.getElementById('stop').addEventListener('click', stopAll);
  list.addEventListener('click', e => {
    const btn = e.target.closest('.play');
    if (!btn) return;
    stopAll(); session++;
    playFrom(parseInt(btn.dataset.i, 10), false);
  });
  rateEl.addEventListener('change', () => { players.forEach(a => { a.playbackRate = parseFloat(rateEl.value); }); });
  if (!HAS_AUDIO && ttsSupported) setInterval(() => { try { if (speechSynthesis.speaking && speechSynthesis.paused) speechSynthesis.resume(); } catch (e) {} }, 4000);
</script>
