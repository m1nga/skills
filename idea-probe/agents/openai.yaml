interface:
  display_name: "Product Idea Stress Test"
  short_description: "Find the biggest product idea risks before you build"
  default_prompt: "Use $idea-probe on this idea before anything is built: cast 4–7 diverse personas from its claimed audience, run honest first-contact simulations (misreads recorded verbatim, start decisions anchored in past behavior), rank problems by breadth × fatality, and deliver a BUILD/NARROW/RETHINK verdict with its assumption debt, fixes, a revised one-pager, and a reality bridge — real-user tests with kill criteria — for what only real users can prove."
