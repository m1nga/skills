interface:
  display_name: "Package Work for Review"
  short_description: "Collect task files and decisions in one review folder"
  default_prompt: "Use $desktop-package to distill this session into one new Desktop folder — standalone documents plus copies of produced files, a fixed entry file a cold reader can start from — then run the five delivery checks (manifest match, broken links, empty shells, copy integrity, real-desktop confirmation) before reporting done."
