name: TaskDock filesystem acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  filesystem:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.8'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s taskdock/scripts -p 'test_*.py' -v
      - run: python taskdock/scripts/demo.py --output "${{ runner.temp }}/taskdock-demo"
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s publish-skill-product/scripts -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
