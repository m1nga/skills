name: TaskDock recovery acceptance
on:
  push:
    branches: [fix/taskdock-recovery-audit-20260919]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Baseline filesystem tests
        run: python3 -m unittest discover -s taskdock/scripts -p 'test_*.py' -v
      - name: Preserve exact tracked source for isolated reproduction
        if: always()
        run: |
          mkdir -p /tmp/taskdock-audit-export
          git archive HEAD > /tmp/taskdock-audit-export/source.tar
          git rev-parse HEAD > /tmp/taskdock-audit-export/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: taskdock-audit-source
          path: /tmp/taskdock-audit-export/
          retention-days: 3
