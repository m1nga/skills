name: Apply reviewed recovery candidate
on:
  push:
    branches: [fix/taskdock-recovery-audit-20260919]
    paths: [.github/workflows/apply-recovery-patch.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/taskdock-recovery-audit-20260919
          fetch-depth: 0
      - name: Verify and apply the reviewed source delta
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          packed = ''.join(Path('.audit/delta.%02d.b64' % i).read_text().strip() for i in (1,2,3))
          raw = lzma.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '148f537b305fc7fdfacd5325fe318df2d0e7d9fd92284c2d5d79a67b4ed31d6c', 'Delta checksum mismatch'
          entries = json.loads(raw)
          pending = []
          for e in entries:
              p = Path(e['path'])
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              assert not p.is_symlink()
              before = p.read_bytes() if p.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None) == e['before'], 'Source drift: ' + str(p)
              if e['after'] is None:
                  pending.append((p, None)); continue
              lines = (before or b'').decode('utf-8').splitlines(True)
              for start, end, replacement in reversed(e['edits']):
                  lines[start:end] = [replacement]
              content = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == e['after'], 'Result checksum mismatch: ' + str(p)
              pending.append((p, content))
          for p, content in pending:
              if content is None:
                  p.unlink()
              else:
                  p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(content)
          print('Applied exactly %d hash-verified changes' % len(entries))
          for i in (1,2,3):
              Path('.audit/delta.%02d.b64' % i).unlink()
          Path('.github/workflows/apply-recovery-patch.yml').unlink()
          PY
      - name: Acceptance checks before candidate commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/recovery-acceptance
          git add -A
          python3 -m unittest discover -s taskdock/scripts -p 'test_*.py' -v 2>&1 | tee /tmp/recovery-acceptance/taskdock-tests.log
          python3 -m unittest discover -s publish-skill-product/scripts -p 'test_*.py' -v 2>&1 | tee /tmp/recovery-acceptance/publisher-tests.log
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/recovery-acceptance/integration-tests.log
          scripts/verify-products 2>&1 | tee /tmp/recovery-acceptance/verify-products.log
          for domain in design release research; do
            python3 taskdock/scripts/demo.py --domain "$domain" --output "/tmp/demo-$domain" | tee "/tmp/recovery-acceptance/demo-$domain.log"
          done
      - name: Commit only the validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix TaskDock recovery contract and public skill boundary; add acceptance tests'
          git push origin HEAD:fix/taskdock-recovery-audit-20260919
          git rev-parse HEAD > /tmp/recovery-acceptance/commit.txt
          git bundle create /tmp/recovery-acceptance/source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-candidate-evidence
          path: /tmp/recovery-acceptance/
          retention-days: 3
